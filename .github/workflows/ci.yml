name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-headless:
    # The headless engine (kernel bridge, commands, MCP, renderer, forge-cli) on Ubuntu with
    # the distribution's OCCT 7.6. Mirrors the environment the M0 session verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Cache Swift toolchain
        uses: actions/cache@v5
        with:
          path: /opt/swift
          key: swift-6.4.0-ubuntu24.04-${{ runner.arch }}
      - name: Bootstrap (Swift 6.4.0 + OCCT dev packages)
        run: scripts/bootstrap-linux.sh
      - name: Build
        run: /opt/swift/usr/bin/swift build --build-tests
      - name: Test
        run: /opt/swift/usr/bin/swift test
      - name: Golden models through forge-cli
        run: .build/debug/forge-cli run Tests/GoldenModelTests/Models/*.json --quiet
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"describe_command","arguments":{"name":"body.create_box"}}}' \
            | .build/debug/forge-cli mcp | python3 -c 'import sys,json; r=[json.loads(l) for l in sys.stdin]; assert r[1]["result"]["isError"] is False, r; print("mcp ok")'
      - name: MCP modeling workflows over stdio
        run: python3 -m unittest discover -s Tests/IntegrationTests -v
      - name: Packaging script regressions
        run: python3 -m unittest discover -s Tests/PackagingTests -v
      - name: FEATURES.md is in sync with SPEC.md
        run: python3 scripts/features.py --check
      - name: Type-check the Windows front end (headless shell API)
        run: FORGE_WIN_CHECK=1 /opt/swift/usr/bin/swift build --product ForgeWin
      # The Linux app (docs/adr/0013): GTK 4 + OpenGL shell, run headless under Xvfb (Mesa).
      - name: Build the Linux app
        run: FORGE_LINUX_APP=1 /opt/swift/usr/bin/swift build --product forge
      - name: Run the Linux app (screenshot self-test)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1600x1000x24" env GDK_BACKEND=x11 .build/debug/forge --screenshot forge-linux.png
          test -s forge-linux.png
      - name: Validate native GTK menu actions
        run: scripts/test-gtk-actions.sh
      - uses: actions/upload-artifact@v5
        with:
          name: forge-linux-screenshot
          path: forge-linux.png
      # Solver cross-check against FreeCAD's planegcs (docs/adr/0003). The oracle is an external,
      # test-only executable (planegcs is LGPL-2.1+ and never linked into Forge, docs/adr/0005).
      - name: Build the planegcs oracle
        run: |
          sudo apt-get install -y --no-install-recommends libeigen3-dev libboost-graph-dev
          tools/planegcs-oracle/build.sh "$RUNNER_TEMP/oracle"
      - name: Cross-check the solver against planegcs
        run: FORGE_PLANEGCS_ORACLE="$RUNNER_TEMP/oracle/planegcs-oracle" /opt/swift/usr/bin/swift test --filter PlanegcsOracle

  cachyos:
    # The desktop install path on CachyOS (Arch): scripts/install-linux.sh installs the
    # distribution packages (OCCT 7.9, GTK 4), the swift.org toolchain, builds release binaries
    # and installs them; then the app's screenshot self-test runs under Xvfb.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: cachyos/cachyos:latest
    steps:
      - name: Prepare the container
        run: |
          pacman -Syu --noconfirm --needed git sudo xorg-server-xvfb xorg-xauth mesa
          useradd -m forge && echo "forge ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/forge
      - uses: actions/checkout@v5
      - name: Cache the Swift toolchain
        uses: actions/cache@v5
        with:
          path: /home/forge/.local/share/forge
          key: swift-6.4.0-cachyos-${{ runner.arch }}
      - name: Install Forge (as a user, with sudo)
        run: |
          chown -R forge . && mkdir -p /home/forge/.local/share && chown -R forge /home/forge
          sudo -u forge -H bash scripts/install-linux.sh
      - name: Run the installed app (screenshot self-test) and forge-cli
        run: |
          sudo -u forge -H bash -c 'cd /home/forge && xvfb-run -a -s "-screen 0 1600x1000x24" env GDK_BACKEND=x11 ~/.local/bin/forge --screenshot forge-cachyos.png && test -s forge-cachyos.png'
          sudo -u forge -H /home/forge/.local/bin/forge-cli run Tests/GoldenModelTests/Models/*.json --quiet
          cp /home/forge/forge-cachyos.png .
      - uses: actions/upload-artifact@v5
        with:
          name: forge-cachyos-screenshot
          path: forge-cachyos.png

  macos-app:
    # Builds OCCT 8.0.1 with the reproducible script, then the whole package including the
    # SwiftUI/Metal app. Needs a runner with Xcode 27 (Swift 6.4, macOS 27 SDK).
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode (27 preferred, else newest installed)
        run: |
          ls -d /Applications/Xcode*.app || true
          XC="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)"
          [ -n "$XC" ] || XC="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          [ -n "$XC" ] || { echo "No Xcode installation found" >&2; exit 1; }
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          swift --version
          xcrun --show-sdk-version
      # Restore/save are separate so the (long) OCCT build is cached even when a later step
      # fails — a plain actions/cache only saves when the whole job succeeds.
      - name: Restore OCCT
        id: occt-cache
        uses: actions/cache/restore@v5
        with:
          path: Vendor/occt
          key: occt-V8_0_1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Build OCCT 8.0.1
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: scripts/build-occt.sh --jobs "$(sysctl -n hw.ncpu)"
      - name: Save OCCT
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Vendor/occt
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}
      - name: Build engine and tests (without the app)
        run: FORGE_NO_APP=1 swift build --build-tests
      - name: Test
        run: FORGE_NO_APP=1 swift test
      - name: Golden models through forge-cli
        run: .build/debug/forge-cli run Tests/GoldenModelTests/Models/*.json --quiet
      - name: MCP modeling workflows over stdio
        run: python3 -m unittest discover -s Tests/IntegrationTests -v
      - name: Packaging script regressions (BSD find)
        run: python3 -m unittest discover -s Tests/PackagingTests -v
      - name: Build app (Metal + SwiftUI)
        if: always()
        run: swift build --product ForgeApp

  windows:
    # The engine, tests and forge-cli on Windows (Swift 6.4, OCCT's official MSVC x64 build),
    # then the native Windows app (docs/adr/0012-windows-app.md).
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@main
        with:
          source: swift.org
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Restore OCCT
        uses: actions/cache@v5
        with:
          path: Vendor/occt/windows-x64
          key: occt-windows-x64-${{ hashFiles('scripts/fetch-occt-windows.sh') }}
      - name: Fetch OCCT
        run: scripts/fetch-occt-windows.sh
      - name: Build engine and tests
        run: |
          . Vendor/occt/windows-x64/forge-env.sh
          swift --version
          swift build --build-tests
      - name: Test
        run: |
          . Vendor/occt/windows-x64/forge-env.sh
          swift test 2>&1 | tee test.log
      - name: Golden models through forge-cli
        if: always()
        run: |
          . Vendor/occt/windows-x64/forge-env.sh
          BIN="$(swift build --show-bin-path)"
          "$BIN/forge-cli.exe" run Tests/GoldenModelTests/Models/*.json --quiet 2>&1 | tee golden.log
      - name: MCP modeling workflows over stdio
        run: |
          . Vendor/occt/windows-x64/forge-env.sh
          BIN="$(swift build --show-bin-path)"
          FORGE_CLI="$BIN/forge-cli.exe" python -m unittest discover -s Tests/IntegrationTests -v
      - name: Build the Windows app (Win32 + Direct3D 11)
        if: always()
        run: |
          . Vendor/occt/windows-x64/forge-env.sh
          swift build --product ForgeWin 2>&1 | tee app-build.log
      - name: Run the Windows app (screenshot self-test)
        if: always()
        run: |
          . Vendor/occt/windows-x64/forge-env.sh
          BIN="$(swift build --show-bin-path)"
          { echo "bin: $BIN"; ls "$BIN" | grep -i -E "forgewin|forge-cli" ; } > app-run.log 2>&1
          EXE="$(find "$BIN" .build -maxdepth 4 -name ForgeWin.exe 2>/dev/null | head -1)"
          echo "exe: $EXE" >> app-run.log
          test -n "$EXE" && test -f "$EXE"
          rm -f forgewin.png
          status=0
          timeout 180 "$EXE" --screenshot forgewin.png >> app-run.log 2>&1 || status=$?
          echo "exit $status" >> app-run.log
          ls -la forgewin.png >> app-run.log 2>&1 || true
          {
            echo "--- PATH (occt / 3rdparty)"; echo "$PATH" | tr ':' '\n' | grep -i -E "occt|3rdparty" || true
            echo "--- missing DLLs of ForgeWin.exe"; ldd "$EXE" 2>&1 | grep -i -E "not found|\?" || echo "(none)"
            K="$(find Vendor/occt -name TKernel.dll | head -1)"
            echo "--- TKernel.dll ($K)"; ldd "$K" 2>&1 | grep -i -E "not found|tbb|jemalloc" || true
            echo "--- tbb / jemalloc files"; find Vendor/occt -iname "tbb12*.dll" -o -iname "jemalloc*.dll" | head
            python -m pip install --quiet pefile
            python scripts/windows-dll-check.py "$(cygpath -w "$(dirname "$EXE")/forge-cli.exe")" "$(cygpath -w "$EXE")"
          } >> app-run.log 2>&1
          test "$status" -eq 0
          test -s forgewin.png
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: forgewin-screenshot
          path: forgewin.png
          if-no-files-found: ignore
      - name: Report
        if: always()
        run: |
          echo "=== test failures"; grep -E "✘|error:|fatal" test.log | head -60 || true
          grep -E "Test run with|Executed" test.log | tail -8 || true
          echo "=== golden"; grep -v "^PASS" golden.log | head -20 || true; grep -c "^PASS" golden.log || true
          echo "=== app build"; grep -E "error|Build complete" app-build.log | head -20 || true
          echo "=== app run"; cat app-run.log || true
          if [ -f forgewin.png ]; then python -c "import base64,sys; sys.stdout.write(base64.b64encode(open('forgewin.png','rb').read()).decode())" | fold -w 150 | sed 's/^/PNG64 /'; fi
